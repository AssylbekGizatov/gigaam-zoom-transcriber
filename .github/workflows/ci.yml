name: Desktop tests and publication guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Import native Windows adapters without opening devices
        if: runner.os == 'Windows'
        run: |
          python -m pip install PyAudioWPatch==0.2.12.8 winrt-runtime==3.2.1 winrt-Windows.Foundation==3.2.1 winrt-Windows.Foundation.Collections==3.2.1 winrt-Windows.Globalization==3.2.1 winrt-Windows.Media.Ocr==3.2.1 winrt-Windows.Graphics.Imaging==3.2.1 winrt-Windows.Storage.Streams==3.2.1 winrt-Windows.Graphics==3.2.1 winrt-Windows.Graphics.Capture==3.2.1 winrt-Windows.Graphics.Capture.Interop==3.2.1 winrt-Windows.Graphics.DirectX==3.2.1 winrt-Windows.Graphics.DirectX.Direct3D11==3.2.1 winrt-Windows.Graphics.DirectX.Direct3D11.Interop==3.2.1 -c constraints.txt
          python -c "import pyaudiowpatch, winrt.windows.media.ocr, winrt.windows.graphics.imaging, winrt.windows.graphics.capture, winrt.windows.graphics.capture.interop, winrt.windows.graphics.directx.direct3d11, winrt.windows.graphics.directx.direct3d11.interop"
      - run: python scripts/check_publication.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 14
  offline-runtime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the same CPU runtime as the Windows user
        run: |
          python -m pip install --user -r requirements-desktop.txt
          python -m pip check
      - name: Acquire pinned GigaAM weights from this repository only
        run: |
          python scripts/acquire_model.py
          python scripts/acquire_model.py --check
      - name: Load and infer with Python network connections blocked
        run: python scripts/verify_offline_runtime.py
